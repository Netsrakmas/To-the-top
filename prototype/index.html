<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Roef de Vis — To the Top (prototype)</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #04121f;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #07263c; box-shadow: 0 0 40px rgba(0,0,0,.6); }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<noscript style="color:#fff;position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center">
  JavaScript staat uit. Zet JavaScript aan of open dit bestand in Safari/Chrome.
</noscript>
<script>
// Toont een eventuele JS-fout als tekst op het scherm (anders zie je alleen blauw).
window.onerror = function (msg, src, line, col) {
  var d = document.getElementById("err") || document.createElement("div");
  d.id = "err";
  d.style.cssText = "position:fixed;left:0;top:0;right:0;z-index:99;background:#400;color:#ffd6d6;" +
    "font:13px/1.4 monospace;padding:12px;white-space:pre-wrap";
  d.textContent = "JS-fout: " + msg + "\n(regel " + line + ":" + col + ")";
  document.body.appendChild(d);
  return false;
};
</script>
<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------------------
  // Config — Roef de Vis: To the Top (speelbaar prototype)
  // ---------------------------------------------------------------------------
  const CFG = {
    levelsTall: 10,           // hoogte van het level in schermen (2x hoger)
    maxCanvasW: 480,          // op desktop centreren; op telefoon = volle breedte
    impulse: 2.5,            // veeg = duwtje: veeg-pixels -> extra snelheid (geen vinger-volgen)
    maxSpeed: 700,            // max zwemsnelheid (px/s)
    friction: 0.945,         // demping per 1/60s -> glijdt door en dooft uit
    gravity: 160,            // px/s^2 zachte zwaartekracht (zakken als je niets doet)
    netSlow: 0.45,            // snelheidsfactor terwijl je door een net glipt
    playerR: 16,
    hearts: 3,
    invulnTime: 1.2,          // onkwetsbaar na een treffer (s)
    // jager (monstervis) per tier: snelheid (px/s) en grootte
    predators: [
      { speed: 165, size: 30, color: "#3a5d74", name: "kleine monstervis" },
      { speed: 205, size: 46, color: "#2f4a63", name: "grote monstervis" },
      { speed: 250, size: 68, color: "#21303f", name: "reuzen-monstervis" },
    ],
    predatorRamp: 6,          // extra px/s per 10s (oplopende druk)
  };

  // ---------------------------------------------------------------------------
  // Canvas / DPI
  // ---------------------------------------------------------------------------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  let VW = 0, VH = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    VW = Math.min(window.innerWidth, CFG.maxCanvasW);
    VH = window.innerHeight;
    canvas.style.width = VW + "px";
    canvas.style.height = VH + "px";
    canvas.width = Math.round(VW * DPR);
    canvas.height = Math.round(VH * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------------------------------------------------------------------------
  // Input (muis + touch via pointer events)
  // ---------------------------------------------------------------------------
  // Relatieve veeg-besturing: Roef beweegt mee met je veeg, waar je ook tikt.
  const ptr = { active: false, x: 0, y: 0, lastX: 0, lastY: 0, dx: 0, dy: 0 };
  function setPtr(e) {
    const r = canvas.getBoundingClientRect();
    ptr.x = e.clientX - r.left;
    ptr.y = e.clientY - r.top;
  }
  canvas.addEventListener("pointerdown", (e) => {
    setPtr(e); ptr.active = true; ptr.lastX = ptr.x; ptr.lastY = ptr.y; ptr.dx = 0; ptr.dy = 0;
    if (state === "title") startGame();
    else if (state === "win" || state === "lose") resetToTitle();
    e.preventDefault();
  });
  canvas.addEventListener("pointermove", (e) => {
    setPtr(e);
    if (ptr.active) {                       // som de veeg-beweging op tot de volgende frame
      ptr.dx += ptr.x - ptr.lastX;
      ptr.dy += ptr.y - ptr.lastY;
      ptr.lastX = ptr.x; ptr.lastY = ptr.y;
    }
    e.preventDefault();
  });
  canvas.addEventListener("pointerup",   (e) => { ptr.active = false; e.preventDefault(); });
  canvas.addEventListener("pointercancel", () => { ptr.active = false; });

  // ---------------------------------------------------------------------------
  // Game state
  // ---------------------------------------------------------------------------
  let state = "title";   // title | play | winning | win | lose
  let world = { h: VH * CFG.levelsTall }, camY = 0;   // defaults zodat de titel-achtergrond werkt
  let player, predator, caught, nets, obstacles, bubbles, plankton, bgWeeds, fgBokeh;
  let score, hearts, time = 0, banner, bannerT, winT;
  let depthTop = 0;          // 0 oppervlak .. 1 diep (gedeeld door achtergrond/sfeer)
  let shake = 0, hitFlash = 0;

  const rnd = (a, b) => a + Math.random() * (b - a);

  function makePredator(tier, y) {
    const p = CFG.predators[Math.min(tier, CFG.predators.length - 1)];
    return { tier, y, x: player.x, vis: p, wob: 0 };
  }

  function startGame() {
    const worldH = VH * CFG.levelsTall;
    world = { h: worldH };
    player = { x: VW / 2, y: worldH - 70, vx: 0, vy: 0, hx: 0, hy: -1, r: CFG.playerR, inNet: false, invuln: 0 };
    hearts = CFG.hearts;
    score = 0; time = 0; winT = 0;
    banner = ""; bannerT = 0;

    // 3 netten: net1 -> tier2, net2 -> tier3, eindnet -> gevangen + win
    nets = [
      { y: worldH * 0.70, passed: false, final: false },
      { y: worldH * 0.42, passed: false, final: false },
      { y: worldH * 0.13, passed: false, final: true },
    ];

    // obstakels verspreid over het level (niet te dicht bij netten/start)
    obstacles = [];
    const nearNet = (y) => nets.some((n) => Math.abs(n.y - y) < 70);
    const jellyCols = ["#b06fe0", "#7d8cff", "#5fd8e0", "#9a6ff0"];   // koele familie; alleen Roef is warm
    for (let i = 0; i < Math.round(CFG.levelsTall * 10.4); i++) {   // dichtheid gelijk bij hoger level
      const y = rnd(160, worldH - 220);
      if (nearNet(y)) continue;
      const zone = y / worldH;        // 0 = oppervlak (boven) .. 1 = diep (onder)
      const rr = Math.random();
      // kwallen overal; rotsen overal; per zone een eigen vijand
      let type;
      if (rr < 0.34) type = "jelly";
      else if (rr < 0.56) type = "rock";
      else type = zone < 0.34 ? "urchin" : zone < 0.67 ? "puffer" : "angler";

      const o = { type, x: rnd(34, VW - 34), y, ph: rnd(0, 6.28),
        dir: (Math.random() < 0.5 ? 0 : Math.PI) + rnd(-0.4, 0.4) };
      if (type === "rock") {
        o.r = rnd(20, 40);
        o.shape = [];
        for (let k = 0; k < 11; k++) o.shape.push(0.78 + rnd(0, 0.34));
        o.tint = rnd(0, 1);
        o.spots = [];
        for (let k = 0; k < 4; k++) o.spots.push({ a: rnd(0, 6.28), d: rnd(0.2, 0.7), s: rnd(0.12, 0.26) });
        o.weed = Math.random() < 0.55;
      } else if (type === "jelly") {
        o.r = rnd(17, 26); o.col = jellyCols[(Math.random() * jellyCols.length) | 0];
        o.pulse = rnd(2.4, 3.8); o.speed = rnd(30, 65);
      } else if (type === "urchin") {            // zee-egel (boven): stekelbal, bijna stil
        o.r = rnd(16, 23); o.spin = (Math.random() < 0.5 ? -1 : 1) * rnd(0.2, 0.5);
        o.spikes = 11 + (Math.random() * 4 | 0);
      } else if (type === "puffer") {            // kogelvis (midden): blaast zich op
        o.r = rnd(16, 22); o.pulse = rnd(1.1, 1.9); o.speed = rnd(14, 34); o.inf = 0;
      } else {                                   // angler/lampvis (diep): gloeiend loklampje
        o.r = rnd(22, 30); o.pulse = rnd(2, 3.5); o.speed = rnd(16, 36);
      }
      obstacles.push(o);
    }

    // luchtbellen (stijgen + zigzag); score-bellen verdwijnen, rest wrapt onderaan
    bubbles = [];
    for (let i = 0; i < Math.round(CFG.levelsTall * 12); i++) {
      bubbles.push({ x: rnd(20, VW - 20), y: rnd(120, worldH - 120), r: rnd(5, 9), got: false,
        vy: rnd(18, 40), ph: rnd(0, 6.28), wspd: rnd(1.5, 3) });
    }

    // zwevend plankton (scherm-ruimte, parallax + drift) en verre wier-silhouetten (parallax)
    plankton = [];
    for (let i = 0; i < 70; i++) {
      plankton.push({ x: rnd(0, VW), y: rnd(0, VH), r: rnd(0.6, 2.2), spd: rnd(4, 14), amp: rnd(4, 14), ph: rnd(0, 6.28) });
    }
    bgWeeds = [];
    for (let i = 0; i < Math.round(CFG.levelsTall * 3.2); i++) {
      bgWeeds.push({ x: rnd(-10, VW + 10), y: rnd(0, worldH), h: rnd(60, 150), w: rnd(8, 18), ph: rnd(0, 6.28), edge: Math.random() < 0.5 });
    }
    // voorgrond-bokeh: grote onscherpe deeltjes dicht bij de "lens" -> diepte
    fgBokeh = [];
    for (let i = 0; i < 9; i++) {
      fgBokeh.push({ x: rnd(0, VW), y: rnd(0, VH), r: rnd(22, 55), spd: rnd(10, 26), ph: rnd(0, 6.28), a: rnd(0.04, 0.10) });
    }

    shake = 0; hitFlash = 0;
    caught = [];   // monstervissen die in een net vast zitten
    predator = makePredator(0, player.y + VH * 0.85);
    camY = clamp(player.y - VH * 0.62, 0, worldH - VH);
    state = "play";
    flash("Een monstervis zit achter je!");
  }

  function resetToTitle() { state = "title"; }
  function flash(msg) { banner = msg; bannerT = 2.2; }
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  function hurt(knockY) {
    if (player.invuln > 0) return;
    hearts--; player.invuln = CFG.invulnTime;
    player.y += knockY;                 // teruggeslagen naar beneden -> jager wint terrein
    shake = Math.max(shake, 7); hitFlash = 1;
    flash("Au! " + hearts + " ❤ over");
    if (hearts <= 0) { state = "lose"; shake = 16; }
  }

  // ---------------------------------------------------------------------------
  // Update
  // ---------------------------------------------------------------------------
  function update(dt) {
    time += dt;
    // fx uitdoven (ook tijdens win/lose zodat shake netjes stopt)
    shake *= Math.pow(0.0025, dt);
    if (shake < 0.3) shake = 0;
    if (hitFlash > 0) hitFlash -= dt * 4;
    if (caught) for (const c of caught) { c.wob += dt * 6; if (c.thrash > 0) c.thrash *= Math.pow(0.5, dt); }
    if (state !== "play" && state !== "winning") return;

    // --- speler ---
    if (state === "play") {
      // Veeg = duwtje: voeg snelheid toe in de veegrichting; Roef glijdt zelf door.
      player.vx += ptr.dx * CFG.impulse;
      player.vy += ptr.dy * CFG.impulse;
      ptr.dx = 0; ptr.dy = 0;
      player.vy += CFG.gravity * dt;                    // zachte zwaartekracht
      const sp = Math.hypot(player.vx, player.vy);      // snelheid begrenzen
      if (sp > CFG.maxSpeed) { const k = CFG.maxSpeed / sp; player.vx *= k; player.vy *= k; }
      const slow = player.inNet ? CFG.netSlow : 1;
      player.x += player.vx * dt * slow;
      player.y += player.vy * dt * slow;
      const fr = Math.pow(CFG.friction, dt * 60);        // demping (glijdt uit)
      player.vx *= fr; player.vy *= fr;
      // Roef draait naar zijn zwemrichting (vloeiend)
      const spd2 = Math.hypot(player.vx, player.vy);
      if (spd2 > 30) {
        const k = Math.min(1, 9 * dt);
        player.hx += (player.vx / spd2 - player.hx) * k;
        player.hy += (player.vy / spd2 - player.hy) * k;
      }
      // niet tegen de randen blijven duwen
      if (player.x <= player.r || player.x >= VW - player.r) player.vx = 0;
      player.x = clamp(player.x, player.r, VW - player.r);
      player.y = clamp(player.y, 40, world.h - player.r);
      if (player.invuln > 0) player.invuln -= dt;
    } else if (state === "winning") {
      player.y -= 260 * dt;               // triomfantelijk naar het oppervlak
      winT += dt;
      if (winT > 1.6) { state = "win"; }
    }

    // --- net passeren: glippen door + escalatie ---
    player.inNet = false;
    for (const n of nets) {
      if (Math.abs(player.y - n.y) < 16) player.inNet = true;
      if (!n.passed && player.y < n.y) {
        n.passed = true;
        // huidige jager komt vast te zitten in dit net en spartelt
        caught.push({ y: n.y, x: predator.x, vis: predator.vis, tier: predator.tier, wob: 0, thrash: 1.4 });
        shake = Math.max(shake, 10);
        if (n.final) {
          state = "winning"; winT = 0;
          flash("De grote vis zit vast in het net!");
        } else {
          // afgeschud -> nieuwe, grotere monstervis komt van onderaf
          predator = makePredator(predator.tier + 1, player.y + VH * 1.1);
          flash("Afgeschud! Grotere monstervis komt eraan!");
        }
      }
    }

    // --- jager (monstervis) ---
    if (state === "play") {
      const ramp = (time / 10) * CFG.predatorRamp;
      const sp = predator.vis.speed + ramp;
      predator.y -= sp * dt;                       // stijgt richting Roef
      predator.x += (player.x - predator.x) * Math.min(1, 1.6 * dt);
      predator.wob += dt * 6;
      // botsing met Roef = einde
      if (Math.hypot(predator.x - player.x, predator.y - player.y) < predator.vis.size * 0.7 + player.r) {
        state = "lose"; shake = 16; flash("Gepakt!");
      }
    }

    // --- obstakels (beweging per type) ---
    for (const o of obstacles) {
      if (o.type === "jelly") {
        // pulserende voortstuwing: sneller tijdens het samentrekken van de klok
        const burst = Math.max(0, Math.sin(time * o.pulse + o.ph));
        const v = o.speed * (0.3 + 1.1 * burst);
        o.x += Math.cos(o.dir) * v * dt;
        o.y += Math.sin(o.dir) * v * dt * 0.5;
        if (o.x < o.r) { o.x = o.r; o.dir = Math.PI - o.dir; }
        if (o.x > VW - o.r) { o.x = VW - o.r; o.dir = Math.PI - o.dir; }
      } else if (o.type === "puffer") {
        o.inf = 0.5 + 0.5 * Math.sin(time * o.pulse + o.ph);   // op/afblazen
        o.x += Math.cos(o.dir) * o.speed * dt;
        if (o.x < o.r || o.x > VW - o.r) o.dir = Math.PI - o.dir;
      } else if (o.type === "angler") {
        o.x += Math.cos(o.dir) * o.speed * dt;                 // trage patrouille
        if (o.x < o.r || o.x > VW - o.r) o.dir = Math.PI - o.dir;
      } else if (o.type === "urchin") {
        o.x += Math.sin(time * 0.6 + o.ph) * 0.15;             // bijna stil, lichte drift
      }
      if (state === "play") {
        // kogelvis-hitbox groeit mee met opblazen; rest = o.r (ongewijzigd)
        const hitR = o.type === "puffer" ? o.r * (0.7 + 0.6 * o.inf) : o.r;
        const dx = player.x - o.x, dy = player.y - o.y;
        const d = Math.hypot(dx, dy) || 1;
        const minD = hitR + player.r;
        if (d < minD) {
          const nx = dx / d, ny = dy / d;
          if (o.type === "rock") {
            // rots = vaste muur: duw Roef eruit en stop de snelheid de rots in (GEEN levensverlies)
            player.x = clamp(o.x + nx * minD, player.r, VW - player.r);
            player.y = o.y + ny * minD;
            const vn = player.vx * nx + player.vy * ny;
            if (vn < 0) { player.vx -= vn * nx; player.vy -= vn * ny; if (vn < -150) shake = Math.max(shake, 4); }
          } else if (player.invuln <= 0) {
            // kwal / zee-egel / kogelvis / lampvis = prik: levensverlies + terugslag
            player.x = clamp(player.x + nx * 14, player.r, VW - player.r);
            hurt(34);
          }
        }
      }
    }

    // --- bellen: stijgen + verzamelen ---
    for (const b of bubbles) {
      if (b.got) continue;
      b.y -= b.vy * dt;                                  // stijgt
      if (b.y < 20) { b.y = world.h - 20; b.x = rnd(20, VW - 20); }
      if (Math.hypot(b.x - player.x, b.y - player.y) < b.r + player.r + 4) { b.got = true; score++; }
    }

    // --- camera (volgt Roef, niet terug naar beneden) ---
    const targetCam = clamp(player.y - VH * 0.62, 0, world.h - VH);
    camY = Math.min(camY, targetCam);            // alleen omhoog
    camY = clamp(camY, 0, world.h - VH);
    if (player.y - camY > VH - 60) camY = player.y - (VH - 60); // Roef niet uit beeld

    if (bannerT > 0) bannerT -= dt;
  }

  // ---------------------------------------------------------------------------
  // Render
  // ---------------------------------------------------------------------------
  const S = (wy) => wy - camY;   // wereld-y -> scherm-y

  // diepte-palet: turquoise -> kobalt -> inktpaars -> afgrond (meerpunts-lerp)
  const ANCHORS = [[0, [40, 150, 180]], [0.4, [16, 84, 128]], [0.72, [20, 42, 84]], [1, [4, 14, 26]]];
  function depthColor(t) {
    t = clamp(t, 0, 1);
    for (let i = 1; i < ANCHORS.length; i++) {
      if (t <= ANCHORS[i][0]) {
        const a = ANCHORS[i - 1], b = ANCHORS[i], f = (t - a[0]) / (b[0] - a[0]);
        return `rgb(${Math.round(a[1][0] + (b[1][0] - a[1][0]) * f)},${Math.round(a[1][1] + (b[1][1] - a[1][1]) * f)},${Math.round(a[1][2] + (b[1][2] - a[1][2]) * f)})`;
      }
    }
    return "rgb(4,14,26)";
  }

  function drawWater() {
    depthTop = camY / world.h;        // 0 oppervlak .. 1 diep (module-scope)
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, depthColor(depthTop));
    g.addColorStop(0.5, depthColor(depthTop + 0.5 * VH / world.h));
    g.addColorStop(1, depthColor(depthTop + VH / world.h));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, VH);

    // geanimeerde godrays (additief, wiegen, doven uit in de diepte)
    const rayA = 0.05 * (1 - depthTop);
    if (rayA > 0.003) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < 6; i++) {
        const x = (i + 0.5) * VW / 6 + Math.sin(time * 0.25 + i * 1.7) * 26;
        const w = VW * 0.16;
        const rg = ctx.createLinearGradient(0, 0, 0, VH);
        rg.addColorStop(0, `rgba(200,240,255,${rayA})`);
        rg.addColorStop(1, "rgba(200,240,255,0)");
        ctx.fillStyle = rg;
        ctx.beginPath();
        ctx.moveTo(x - w * 0.3, 0); ctx.lineTo(x + w * 0.3, 0);
        ctx.lineTo(x + w, VH); ctx.lineTo(x - w, VH); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }

    // oppervlak: golvende shimmer-band als het in beeld is
    const surfY = S(0);
    if (surfY > -40 && surfY < VH) {
      ctx.fillStyle = "rgba(150,225,255,.22)";
      ctx.beginPath();
      ctx.moveTo(0, surfY);
      for (let x = 0; x <= VW; x += 18) ctx.lineTo(x, surfY - 6 + Math.sin(x * 0.05 + time * 2) * 4);
      ctx.lineTo(VW, 0); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
    }
    // caustics-net in de ondiepe bovenlaag
    if (depthTop < 0.35) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const ca = 0.055 * (1 - depthTop / 0.35);
      ctx.strokeStyle = `rgba(180,235,255,${ca})`; ctx.lineWidth = 2;
      for (let j = 0; j < 3; j++) {
        ctx.beginPath();
        for (let x = 0; x <= VW; x += 12) {
          const yy = (j + 1) * VH * 0.12 + Math.sin(x * 0.04 + time * 1.5 + j) * 10;
          x === 0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
        }
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // verre wier-silhouetten (trage parallax) — achtergrond-diepte
  function drawBackdrop() {
    ctx.fillStyle = "rgba(10,30,46,.55)";
    for (const w of bgWeeds) {
      const sy = w.y - camY * 0.4;
      const yy = ((sy % world.h) + world.h) % world.h;        // wrap over de wereld
      if (yy > VH + w.h || yy < -w.h) continue;
      const base = yy;
      ctx.beginPath();
      ctx.moveTo(w.x - w.w / 2, base);
      ctx.quadraticCurveTo(w.x - w.w / 2 + Math.sin(time + w.ph) * 14, base - w.h * 0.6, w.x + Math.sin(time * 0.8 + w.ph) * 18, base - w.h);
      ctx.quadraticCurveTo(w.x + w.w / 2 + Math.sin(time + w.ph) * 14, base - w.h * 0.6, w.x + w.w / 2, base);
      ctx.closePath(); ctx.fill();
    }
  }

  // zwevend plankton (additieve stipjes die opstijgen en wiegen)
  function drawPlankton() {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const a = 0.5 * (1 - depthTop);
    ctx.fillStyle = `rgba(200,235,255,${a})`;
    for (const p of plankton) {
      const py = (((p.y - time * p.spd - camY * 0.2) % VH) + VH) % VH;
      const px = p.x + Math.sin(time * 0.6 + p.ph) * p.amp;
      ctx.beginPath(); ctx.arc(px, py, p.r, 0, 6.28); ctx.fill();
    }
    ctx.restore();
  }

  // atmosferische diepte-waas over de achtergrond/midground
  function drawFog() {
    ctx.fillStyle = `rgba(10,40,60,${(0.08 + 0.30 * depthTop).toFixed(3)})`;
    ctx.fillRect(0, 0, VW, VH);
  }

  // voorgrond-bokeh: onscherpe deeltjes dicht bij de lens (snelle parallax) -> diepte
  function drawForeground() {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const f of fgBokeh) {
      const py = (((f.y - time * f.spd - camY * 1.5) % VH) + VH) % VH;
      const px = f.x + Math.sin(time * 0.4 + f.ph) * 18;
      const g = ctx.createRadialGradient(px, py, 0, px, py, f.r);
      g.addColorStop(0, `rgba(190,225,255,${f.a})`);
      g.addColorStop(1, "rgba(190,225,255,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(px, py, f.r, 0, 6.28); ctx.fill();
    }
    ctx.restore();
  }

  // cinematisch edge-vignet (donkere hoeken, focus naar het midden)
  function drawVignette() {
    const vg = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.45, VW / 2, VH / 2, VH * 0.8);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,14,.34)");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
  }

  // monstervis (predator + gevangen): dreigend silhouet, rim-light, gloeiende ogen
  function predatorPath(cx, cy, s, wob, tier, thrash) {
    thrash = thrash || 0;
    const t = Math.min(tier || 0, 2);
    const bodies = [["#3e5a72", "#1f2c3c"], ["#5a3a72", "#1f1838"], ["#5a2a46", "#181222"]];
    const eyes = [["#ffe066", "#ffaa22"], ["#ffcc44", "#ff6622"], ["#ffdd55", "#ff2a16"]];
    const [rim, core] = bodies[t];
    ctx.save();
    ctx.translate(cx + (thrash ? Math.sin(wob * 9) * s * 0.12 * thrash : 0), cy);
    ctx.rotate(Math.sin(wob * 2.5) * (0.08 + thrash * 0.5));
    // staart
    const tw = Math.sin(wob * 3) * s * (0.25 + thrash * 0.5);
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.moveTo(0, s * 0.7); ctx.lineTo(-s * 0.6 + tw, s * 1.25); ctx.lineTo(s * 0.6 + tw, s * 1.25);
    ctx.closePath(); ctx.fill();
    // lijf met radiale gradient (volume) + rim-light contour
    const bg = ctx.createRadialGradient(-s * 0.2, -s * 0.3, s * 0.1, 0, 0, s * 1.15);
    bg.addColorStop(0, rim); bg.addColorStop(1, core);
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.62, s, 0, 0, 6.28); ctx.fill();
    ctx.lineWidth = Math.max(1.5, s * 0.06); ctx.strokeStyle = "rgba(170,205,235,.5)";
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.62, s, 0, 0, 6.28); ctx.stroke();
    // bek + tanden (meer tanden per tier)
    ctx.fillStyle = "#070b11";
    ctx.beginPath(); ctx.ellipse(0, -s * 0.78, s * 0.36, s * 0.26 + Math.abs(Math.sin(wob)) * s * 0.12, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = "#fff";
    const teeth = 3 + t;
    for (let i = 0; i < teeth; i++) {
      const tx = (-(teeth - 1) / 2 + i) * s * 0.17;
      ctx.beginPath(); ctx.moveTo(tx, -s * 0.92); ctx.lineTo(tx - s * 0.05, -s * 0.74); ctx.lineTo(tx + s * 0.05, -s * 0.74); ctx.fill();
    }
    // gloeiende ogen (pulserend) + verticale spleet-pupil
    const pulse = 0.7 + 0.3 * Math.sin(time * 5 + wob);
    for (const ex of [-s * 0.3, s * 0.3]) {
      const eg = ctx.createRadialGradient(ex, -s * 0.42, 0, ex, -s * 0.42, s * 0.32 * pulse);
      eg.addColorStop(0, eyes[t][0]); eg.addColorStop(0.5, eyes[t][1]); eg.addColorStop(1, "rgba(255,40,0,0)");
      ctx.fillStyle = eg;
      ctx.beginPath(); ctx.arc(ex, -s * 0.42, s * 0.32 * pulse, 0, 6.28); ctx.fill();
      ctx.fillStyle = "#0a0408";
      ctx.beginPath(); ctx.ellipse(ex, -s * 0.42, s * 0.05, s * 0.14, 0, 0, 6.28); ctx.fill();
    }
    ctx.restore();
  }

  function drawRoef() {
    if (player.invuln > 0 && Math.floor(time * 12) % 2 === 0) return; // knipper bij i-frames
    const cx = player.x, cy = S(player.y), s = player.r;
    const spd = Math.hypot(player.vx, player.vy);

    // warme gloed-halo: verankert Roef als enige warm-glanzende held
    const halo = ctx.createRadialGradient(cx, cy, s * 0.4, cx, cy, s * 2.4);
    halo.addColorStop(0, "rgba(255,150,60,.30)");
    halo.addColorStop(1, "rgba(255,150,60,0)");
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(cx, cy, s * 2.4, 0, 6.28); ctx.fill();

    // platte schaduw eronder (diepte-leesbaarheid)
    ctx.fillStyle = "rgba(0,0,0,.18)";
    ctx.beginPath(); ctx.ellipse(cx, cy + s * 1.3, s * 0.8, s * 0.28, 0, 0, 6.28); ctx.fill();

    ctx.save();
    ctx.translate(cx, cy);
    // idle-dobber bij lage snelheid
    const idle = 1 - Math.min(1, spd / 120);
    ctx.translate(0, Math.sin(time * 2) * s * 0.12 * idle);
    ctx.rotate(Math.atan2(player.hy, player.hx) + Math.PI / 2 + Math.sin(time * 1.6) * 0.05 * idle);
    ctx.lineJoin = "round";
    // staart (kwispelt; sneller zwemmen = sneller kwispelen)
    const wag = Math.sin(time * (8 + spd * 0.02)) * s * 0.35;
    ctx.fillStyle = "#ff7a2f";
    ctx.beginPath();
    ctx.moveTo(0, s * 0.6);
    ctx.lineTo(-s * 0.7 + wag, s * 1.25);
    ctx.lineTo(s * 0.7 + wag, s * 1.25);
    ctx.closePath(); ctx.fill();
    // zijvinnen (flutteren mee tijdens het zwemmen)
    const fin = Math.sin(time * 9) * 0.3;
    ctx.fillStyle = "#ff9c5e";
    ctx.beginPath(); ctx.ellipse(-s * 0.6, s * 0.1, s * 0.35, s * 0.18, 0.6 + fin, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s * 0.6, s * 0.1, s * 0.35, s * 0.18, -0.6 - fin, 0, 6.28); ctx.fill();
    // lijf met radiale gradient (volume) + lichte contour
    const bg = ctx.createRadialGradient(-s * 0.25, -s * 0.35, s * 0.15, 0, 0, s * 1.15);
    bg.addColorStop(0, "#ffb066"); bg.addColorStop(0.6, "#ff8a3d"); bg.addColorStop(1, "#e0641f");
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.7, s, 0, 0, 6.28); ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(255,225,190,.6)";
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.7, s, 0, 0, 6.28); ctx.stroke();
    // lichte buik + buikschaduw onderaan
    ctx.fillStyle = "#ffe1c0";
    ctx.beginPath(); ctx.ellipse(0, s * 0.12, s * 0.4, s * 0.62, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = "rgba(120,40,0,.12)";
    ctx.beginPath(); ctx.ellipse(0, s * 0.55, s * 0.5, s * 0.35, 0, 0, 6.28); ctx.fill();
    // oog
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(s * 0.28, -s * 0.45, s * 0.22, 0, 6.28); ctx.fill();
    ctx.fillStyle = "#16242e"; ctx.beginPath(); ctx.arc(s * 0.33, -s * 0.45, s * 0.11, 0, 6.28); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.beginPath(); ctx.arc(s * 0.26, -s * 0.5, s * 0.05, 0, 6.28); ctx.fill();
    ctx.restore();
  }

  function drawNet(n) {
    const y = S(n.y);
    if (y < -40 || y > VH + 40) return;
    const h = 26;
    const sag = (x) => Math.sin((x / VW) * Math.PI) * 9;     // catenary-doorhang
    ctx.save();
    // zacht lichtband zodat het net opvalt als 'gate'
    ctx.fillStyle = n.final ? "rgba(255,215,120,.10)" : "rgba(200,235,255,.07)";
    ctx.fillRect(0, y - h, VW, h * 2);
    // ruitjes-mesh (helderder)
    ctx.strokeStyle = n.final ? "rgba(255,235,180,.7)" : "rgba(235,245,230,.62)";
    ctx.lineWidth = 1.5;
    for (let x = -h; x < VW + h; x += 13) {
      const s0 = sag(x), s1 = sag(x + h);
      ctx.beginPath(); ctx.moveTo(x, y - h / 2 + s0); ctx.lineTo(x + h, y + h / 2 + s1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + h, y - h / 2 + s1); ctx.lineTo(x, y + h / 2 + s0); ctx.stroke();
    }
    // touwen boven/onder (goud voor het eind-net)
    ctx.strokeStyle = n.final ? "rgba(220,180,80,.95)" : "rgba(120,90,60,.9)";
    ctx.lineWidth = 3;
    for (const off of [-h / 2, h / 2]) {
      ctx.beginPath();
      for (let x = 0; x <= VW; x += 16) { const yy = y + off + sag(x); x === 0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy); }
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawObstacle(o) {
    const y = S(o.y);
    if (y < -50 || y > VH + 50) return;
    if (o.type === "rock") {
      const r = o.r, n = o.shape.length;
      ctx.save();
      ctx.translate(o.x, y);
      // onregelmatig silhouet
      ctx.beginPath();
      for (let k = 0; k <= n; k++) {
        const a = (k % n) / n * 6.283, rad = r * o.shape[k % n];
        const px = Math.cos(a) * rad, py = Math.sin(a) * rad;
        k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = o.tint < 0.5 ? "#566879" : "#5f5847"; ctx.fill();
      // heldere rand-contour zodat de rots ook in diep water loskomt van de achtergrond
      ctx.lineWidth = 2.5; ctx.strokeStyle = "rgba(165,200,230,.5)"; ctx.stroke();
      // kernschaduw onder, top-licht boven (lichtbron = boven)
      ctx.fillStyle = "rgba(0,0,0,.30)";
      ctx.beginPath(); ctx.ellipse(0, r * 0.34, r * 0.58, r * 0.4, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.16)";
      ctx.beginPath(); ctx.ellipse(-r * 0.15, -r * 0.42, r * 0.5, r * 0.3, 0, 0, 6.28); ctx.fill();
      // vlekjes
      ctx.fillStyle = "rgba(0,0,0,.18)";
      for (const sp of o.spots) { ctx.beginPath(); ctx.arc(Math.cos(sp.a) * r * sp.d, Math.sin(sp.a) * r * sp.d, r * sp.s, 0, 6.28); ctx.fill(); }
      ctx.restore();
      // algen-rand bovenop (zodat de rots niet in het water wegvalt)
      if (o.weed) {
        ctx.strokeStyle = "#3a6b4a"; ctx.lineWidth = 3; ctx.lineCap = "round";
        for (let k = -2; k <= 2; k++) {
          const bx = o.x + k * r * 0.28;
          ctx.beginPath(); ctx.moveTo(bx, y - r * 0.7);
          ctx.quadraticCurveTo(bx + Math.sin(time * 2 + k) * 5, y - r, bx + Math.sin(time + k) * 4, y - r * 1.3);
          ctx.stroke();
        }
        ctx.lineCap = "butt";
      }
    } else if (o.type === "jelly") {
      drawJellyfish(o, y);
    } else if (o.type === "urchin") {
      drawUrchin(o, y);
    } else if (o.type === "puffer") {
      drawPuffer(o, y);
    } else if (o.type === "angler") {
      drawAngler(o, y);
    }
  }

  // zee-egel (boven): draaiende stekelbal
  function drawUrchin(o, y) {
    const r = o.r;
    ctx.save();
    ctx.translate(o.x, y);
    ctx.globalAlpha = 0.16; ctx.fillStyle = "#9a7fd0";
    ctx.beginPath(); ctx.arc(0, 0, r * 1.3, 0, 6.28); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.rotate(time * o.spin);
    ctx.strokeStyle = "#221c34"; ctx.lineWidth = 3; ctx.lineCap = "round";
    for (let i = 0; i < o.spikes; i++) {
      const a = i / o.spikes * 6.283;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r * 0.55, Math.sin(a) * r * 0.55);
      ctx.lineTo(Math.cos(a) * r * 1.25, Math.sin(a) * r * 1.25);
      ctx.stroke();
    }
    ctx.lineCap = "butt";
    ctx.fillStyle = "#3a3052";
    ctx.beginPath(); ctx.arc(0, 0, r * 0.62, 0, 6.28); ctx.fill();
    ctx.strokeStyle = "rgba(175,155,215,.55)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.62, 0, 6.28); ctx.stroke();
    ctx.fillStyle = "rgba(190,205,235,.45)";
    ctx.beginPath(); ctx.arc(-r * 0.2, -r * 0.2, r * 0.16, 0, 6.28); ctx.fill();
    ctx.restore();
  }

  // kogelvis (midden): blaast zich op (stekels + grotere hitbox bij opblazen)
  function drawPuffer(o, y) {
    const inf = o.inf || 0, r = o.r * (0.7 + 0.6 * inf);
    ctx.save();
    ctx.translate(o.x, y);
    if (inf > 0.12) {
      ctx.strokeStyle = "#3a6f6a"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
      const n = 12;
      for (let i = 0; i < n; i++) {
        const a = i / n * 6.283, ln = r * (0.92 + 0.3 * inf);
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r * 0.78, Math.sin(a) * r * 0.78);
        ctx.lineTo(Math.cos(a) * ln, Math.sin(a) * ln);
        ctx.stroke();
      }
      ctx.lineCap = "butt";
    }
    ctx.fillStyle = "#4f7d72";
    ctx.beginPath(); ctx.arc(0, 0, r * 0.8, 0, 6.28); ctx.fill();
    ctx.strokeStyle = "rgba(170,225,215,.5)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.8, 0, 6.28); ctx.stroke();
    ctx.fillStyle = "rgba(220,240,235,.5)";
    ctx.beginPath(); ctx.ellipse(0, r * 0.25, r * 0.5, r * 0.33, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.18)";
    ctx.beginPath(); ctx.ellipse(-r * 0.25, -r * 0.3, r * 0.3, r * 0.2, 0, 0, 6.28); ctx.fill();
    for (const ex of [-r * 0.28, r * 0.28]) {
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex, -r * 0.22, r * 0.15, 0, 6.28); ctx.fill();
      ctx.fillStyle = "#16242e"; ctx.beginPath(); ctx.arc(ex, -r * 0.22, r * 0.075, 0, 6.28); ctx.fill();
    }
    ctx.strokeStyle = "#16242e"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, r * 0.18, r * 0.16, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke();
    ctx.restore();
  }

  // lampvis / anglerfish (diep): donker lijf, happende bek, gloeiend loklampje
  function drawAngler(o, y) {
    const r = o.r, faceR = Math.cos(o.dir) >= 0;
    ctx.save();
    ctx.translate(o.x, y);
    ctx.scale(faceR ? 1 : -1, 1);
    // hengel + gloeiend (koel-bioluminescent) loklampje vóór de kop
    const lx = r * 0.8, ly = -r * 0.95;
    ctx.strokeStyle = "#39584f"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(r * 0.2, -r * 0.55); ctx.quadraticCurveTo(r * 0.6, -r * 1.15, lx, ly); ctx.stroke();
    const lp = 0.6 + 0.4 * Math.sin(time * 4 + o.ph);
    const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, r * 0.6 * lp);
    lg.addColorStop(0, "#e8fff6"); lg.addColorStop(0.4, "#7fffd4"); lg.addColorStop(1, "rgba(127,255,212,0)");
    ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(lx, ly, r * 0.6 * lp, 0, 6.28); ctx.fill();
    ctx.fillStyle = "#eafff5"; ctx.beginPath(); ctx.arc(lx, ly, r * 0.13, 0, 6.28); ctx.fill();
    // staart
    ctx.fillStyle = "#141d24";
    ctx.beginPath(); ctx.moveTo(-r * 0.85, 0); ctx.lineTo(-r * 1.3, -r * 0.45); ctx.lineTo(-r * 1.3, r * 0.45); ctx.closePath(); ctx.fill();
    // bol lijf
    ctx.fillStyle = "#26333c";
    ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.82, 0, 0, 6.28); ctx.fill();
    ctx.strokeStyle = "rgba(150,190,200,.45)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.82, 0, 0, 6.28); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.07)";
    ctx.beginPath(); ctx.ellipse(-r * 0.2, -r * 0.3, r * 0.5, r * 0.28, 0, 0, 6.28); ctx.fill();
    // grote happende bek + tanden (vooraan)
    ctx.fillStyle = "#070b10";
    ctx.beginPath(); ctx.ellipse(r * 0.5, r * 0.18, r * 0.5, r * 0.42, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = "#fff";
    for (let i = 0; i < 5; i++) {
      const ty = -r * 0.18 + i * r * 0.17;
      ctx.beginPath(); ctx.moveTo(r * 0.86, ty); ctx.lineTo(r * 0.62, ty - r * 0.06); ctx.lineTo(r * 0.62, ty + r * 0.06); ctx.fill();
    }
    // oog
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(-r * 0.1, -r * 0.28, r * 0.16, 0, 6.28); ctx.fill();
    ctx.fillStyle = "#10202c"; ctx.beginPath(); ctx.arc(-r * 0.07, -r * 0.28, r * 0.08, 0, 6.28); ctx.fill();
    ctx.restore();
  }

  function drawJellyfish(o, y) {
    const pulse = Math.sin(time * o.pulse + o.ph);   // -1..1
    const r = o.r;
    ctx.save();
    ctx.translate(o.x, y);
    ctx.rotate(o.dir + Math.PI / 2);                 // klok wijst de zwemrichting op, tentakels erachter
    // zachte gloed, gekoppeld aan de puls
    ctx.globalAlpha = 0.12 + 0.2 * Math.max(0, pulse);
    ctx.fillStyle = o.col;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.6, 0, 6.28); ctx.fill();
    ctx.globalAlpha = 1;
    // tentakels (golvend, slepen achter de klok)
    ctx.strokeStyle = o.col; ctx.lineWidth = 2.2; ctx.globalAlpha = 0.85;
    for (let i = -3; i <= 3; i++) {
      const tx = i * r * 0.16;
      const wob = Math.sin(time * o.pulse * 1.6 + i * 0.7 + o.ph) * r * 0.22;
      ctx.beginPath();
      ctx.moveTo(tx, r * 0.15);
      ctx.quadraticCurveTo(tx + wob, r * 0.95, tx + wob * 0.6, r * 1.8);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // klok (samentrekken/uitzetten = voortstuwing)
    const sx = 1 + 0.14 * pulse, syc = 1 - 0.16 * pulse;
    ctx.fillStyle = o.col;
    ctx.beginPath(); ctx.ellipse(0, 0, r * sx, r * 0.9 * syc, 0, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 0, r * sx, r * 0.28 * syc, 0, 0, Math.PI); ctx.fill();
    // glansje + frilletjes onder de rand
    ctx.fillStyle = "rgba(255,255,255,.28)";
    ctx.beginPath(); ctx.ellipse(-r * 0.32 * sx, -r * 0.3, r * 0.22, r * 0.16, 0, 0, 6.28); ctx.fill();
    ctx.restore();
  }

  function drawBubble(b) {
    if (b.got) return;
    const y = S(b.y);
    if (y < -10 || y > VH + 10) return;
    ctx.strokeStyle = "rgba(220,250,255,.7)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(b.x, y, b.r, 0, 6.28); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.beginPath(); ctx.arc(b.x - b.r * 0.3, y - b.r * 0.3, b.r * 0.3, 0, 6.28); ctx.fill();
  }

  function drawHUD() {
    // hit-flash (volledig scherm) + kwetsbaar-vignet zolang i-frames lopen
    if (state === "play" || state === "winning") {
      if (player && player.invuln > 0) {
        const va = 0.5 * (player.invuln / CFG.invulnTime);
        const vg = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.3, VW / 2, VH / 2, VH * 0.75);
        vg.addColorStop(0, "rgba(200,30,30,0)");
        vg.addColorStop(1, `rgba(200,30,30,${va.toFixed(3)})`);
        ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
      }
    }
    if (hitFlash > 0) { ctx.fillStyle = `rgba(255,60,40,${(0.35 * hitFlash).toFixed(3)})`; ctx.fillRect(0, 0, VW, VH); }

    // hartjes
    ctx.font = "20px system-ui";
    ctx.textBaseline = "top";
    for (let i = 0; i < CFG.hearts; i++) {
      ctx.globalAlpha = i < hearts ? 1 : 0.25;
      ctx.fillText("❤", 12 + i * 26, 12);
    }
    ctx.globalAlpha = 1;
    // score (bellen)
    ctx.fillStyle = "#dffaff"; ctx.font = "bold 18px system-ui";
    ctx.textAlign = "right";
    ctx.fillText("🫧 " + score, VW - 12, 14);
    ctx.textAlign = "left";

    // voortgangsbalk (diepte -> oppervlak) rechts
    const bx = VW - 10, top = 70, bot = VH - 90, h = bot - top;
    ctx.fillStyle = "rgba(255,255,255,.15)"; ctx.fillRect(bx - 4, top, 6, h);
    const prog = 1 - clamp(player.y / world.h, 0, 1);   // 1 = aan top
    ctx.fillStyle = "#7fe0ff"; ctx.fillRect(bx - 4, bot - h * prog, 6, h * prog);
    ctx.font = "11px system-ui"; ctx.fillStyle = "#bfe9ff"; ctx.textAlign = "right";
    ctx.fillText("TOP", bx - 12, top - 2);
    ctx.textAlign = "left";

    // jager-nabijheid: rode gloed onderaan
    if (state === "play") {
      const d = predator.y - player.y;            // afstand onder Roef
      const near = clamp(1 - d / (VH * 0.9), 0, 1);
      if (near > 0.05) {
        const g = ctx.createLinearGradient(0, VH, 0, VH - 160 * near);
        g.addColorStop(0, `rgba(200,30,30,${0.5 * near})`);
        g.addColorStop(1, "rgba(200,30,30,0)");
        ctx.fillStyle = g; ctx.fillRect(0, VH - 160, VW, 160);
        if (near > 0.6 && Math.floor(time * 4) % 2 === 0) {
          ctx.fillStyle = "#ffd2d2"; ctx.font = "bold 16px system-ui"; ctx.textAlign = "center";
          ctx.fillText("⚠ achter je!", VW / 2, VH - 40); ctx.textAlign = "left";
        }
      }
    }

    // banner-melding
    if (bannerT > 0 && banner) {
      ctx.globalAlpha = clamp(bannerT, 0, 1);
      ctx.fillStyle = "rgba(0,0,0,.45)";
      ctx.fillRect(0, VH * 0.32, VW, 40);
      ctx.fillStyle = "#fff"; ctx.font = "bold 15px system-ui"; ctx.textAlign = "center";
      ctx.fillText(banner, VW / 2, VH * 0.32 + 12);
      ctx.textAlign = "left"; ctx.globalAlpha = 1;
    }
  }

  function centerText(lines) {
    ctx.fillStyle = "rgba(0,10,20,.6)"; ctx.fillRect(0, 0, VW, VH);
    ctx.textAlign = "center";
    let y = VH * 0.32;
    for (const l of lines) {
      ctx.fillStyle = l.c || "#fff";
      ctx.font = l.f || "18px system-ui";
      ctx.fillText(l.t, VW / 2, y);
      y += l.s || 30;
    }
    ctx.textAlign = "left";
  }

  function render() {
    drawWater();
    if (state === "title") {
      centerText([
        { t: "🐟  ROEF DE VIS", f: "bold 30px system-ui", s: 40, c: "#ffb066" },
        { t: "To the Top", f: "italic 20px system-ui", s: 50, c: "#cfeeff" },
        { t: "Veeg een richting op → Roef zwemt", f: "15px system-ui", s: 24 },
        { t: "die kant op in een rechte lijn.", f: "15px system-ui", s: 28 },
        { t: "Glip door de netten — de monstervis", f: "15px system-ui", s: 24 },
        { t: "kan er niet door en raakt verstrikt.", f: "15px system-ui", s: 44 },
        { t: "Rotsen blokkeren • vijanden prikken!", f: "15px system-ui", s: 24, c: "#9fd" },
        { t: "egels boven, kogelvis midden, lampvis diep.", f: "13px system-ui", s: 46, c: "#9fd" },
        { t: "▶ Tik om te starten", f: "bold 20px system-ui", c: "#fff" },
      ]);
      return;
    }

    // wereld binnen een shake-offset (water + HUD blijven stil = leesbaar)
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawBackdrop();
    drawPlankton();
    for (const c of caught) {        // gevangen monstervissen achter je (spartelen) — mag wazen
      const y = S(c.y);
      if (y > -80 && y < VH + 80) predatorPath(c.x, y, c.vis.size, c.wob, c.tier, c.thrash);
    }
    drawFog();                        // waas alleen over de verre achtergrond
    // gameplay-objecten staan VÓÓR de waas -> altijd scherp leesbaar
    nets.forEach(drawNet);
    obstacles.forEach(drawObstacle);
    bubbles.forEach(drawBubble);
    if (state === "play") predatorPath(predator.x, S(predator.y), predator.vis.size, predator.wob, predator.tier, 0);
    drawRoef();
    ctx.restore();
    drawForeground();   // bokeh-deeltjes dicht bij de lens (geen shake)
    drawVignette();     // cinematische focus
    drawHUD();

    if (state === "win") {
      centerText([
        { t: "🎉 The Top!", f: "bold 30px system-ui", s: 42, c: "#9fd" },
        { t: "Roef ontsnapt — klein zijn redt hem!", s: 40 },
        { t: "🫧 " + score + " bellen verzameld", s: 50, c: "#cfeeff" },
        { t: "...maar boven water cirkelt een meeuw 🐦", f: "italic 17px system-ui", s: 30, c: "#ffd2a0" },
        { t: "Wordt vervolgd —", f: "italic 17px system-ui", s: 46, c: "#ffd2a0" },
        { t: "▶ Tik om opnieuw te spelen", f: "bold 18px system-ui", c: "#fff" },
      ]);
    } else if (state === "lose") {
      centerText([
        { t: "🦈 Gepakt!", f: "bold 30px system-ui", s: 42, c: "#ff8080" },
        { t: "De monstervis was net iets sneller.", s: 44 },
        { t: "🫧 " + score + " bellen verzameld", s: 50, c: "#cfeeff" },
        { t: "▶ Tik om opnieuw te proberen", f: "bold 18px system-ui", c: "#fff" },
      ]);
    }
  }

  // ---------------------------------------------------------------------------
  // Loop
  // ---------------------------------------------------------------------------
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;
    try {
      update(dt);
      render();
    } catch (e) {
      window.onerror("in frame: " + (e && e.message ? e.message : e), "", 0, 0);
      return; // stop de loop zodat de fout leesbaar blijft
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
